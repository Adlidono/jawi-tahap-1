<!DOCTYPE html><html lang="ms"><head><meta name="ms-sp-authoring-source" content="agent"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#62c9ba"><title>Jawi Kids Adventure Tahun 1-3</title><style>
:root{--teal:#62c9ba;--sky:#7fd4ff;--yellow:#ffe37b;--pink:#ffb6c8;--ink:#27485a;--green:#42a778;--red:#ed6f6f}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#c9f0ff,#ddf7df 60%,#fff2a9)}button{font:inherit}.app{max-width:1050px;min-height:calc(100vh - 32px);margin:auto;background:#fffdf6;border:5px solid #fff;border-radius:30px;overflow:hidden;box-shadow:0 16px 35px #3a789033}header{padding:16px 20px;background:linear-gradient(110deg,var(--teal),var(--sky));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;color:#fff;font-size:clamp(1.35rem,4vw,2.35rem);text-shadow:0 3px #32958a}.brand p{margin:4px 0 0;font-weight:900}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.chip{background:#fff;border:3px solid var(--yellow);border-radius:17px;padding:7px 11px;font-weight:900;white-space:nowrap}.view{display:none;padding:clamp(18px,4vw,34px);text-align:center}.view.active{display:block}.year-grid,.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.year,.card{border:0;border-radius:24px;padding:18px 12px;cursor:pointer;color:var(--ink);box-shadow:0 8px 0 #35778a22}.year{min-height:145px}.year:nth-child(1),.card:nth-child(3n+1){background:#c9f0ff}.year:nth-child(2),.card:nth-child(3n+2){background:#c9f1d8}.year:nth-child(3),.card:nth-child(3n){background:#fff0a5}.year strong,.card strong{display:block;font-size:1.25rem;margin:8px}.icon{font-size:3.1rem;display:block}.card{min-height:150px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.back,.primary{border:0;border-radius:17px;padding:11px 17px;font-weight:900;cursor:pointer}.back{background:#dff3ff;box-shadow:0 5px 0 #add7e9}.primary{background:var(--teal);box-shadow:0 6px 0 #2e8f85;margin:6px}.timer{height:14px;background:#dceff4;border-radius:99px;overflow:hidden;max-width:700px;margin:0 auto 17px}.fill{height:100%;background:linear-gradient(90deg,#67d5a1,#ffe36f,#ff8585);transition:width 1s linear}.arena{min-height:310px;display:grid;place-items:center;background:#fff;border:4px solid #daf0f6;border-radius:28px;padding:24px;box-shadow:0 9px 0 #cbe5ec}.prompt{font-size:clamp(1.2rem,4vw,1.7rem);font-weight:900}.jawi{font-family:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;direction:rtl;font-size:clamp(4rem,14vw,8rem);line-height:1.25;color:#267e76}.word{font-size:clamp(2.7rem,10vw,5rem)}.picture{font-size:4.8rem}.answers{max-width:800px;margin:20px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.answer{border:0;border-radius:20px;min-height:72px;padding:10px;background:var(--yellow);box-shadow:0 7px 0 #dfb943;font-size:clamp(1.15rem,4vw,1.8rem);font-weight:900;cursor:pointer}.answer:nth-child(even){background:#b8ead0;box-shadow:0 7px 0 #67b891}.jawi-option{font-family:"Traditional Arabic",serif;direction:rtl;font-size:2.4rem}.feedback{min-height:42px;font-size:1.4rem;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}.letter-board,.word-bank,.built{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.tile{min-width:70px;min-height:70px;border:0;border-radius:18px;background:#d8f3e5;box-shadow:0 6px 0 #85c9a7;font-family:"Traditional Arabic",serif;font-size:2.5rem;cursor:pointer}.built{min-height:78px;border:3px dashed #89cfe4;border-radius:20px;padding:10px;margin-bottom:18px}.medal{font-size:5rem}.burst{position:fixed;z-index:9;pointer-events:none;font-size:2rem;animation:burst .9s forwards}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}@media(max-width:720px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}.game-grid{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.stats{max-width:150px}.chip{font-size:.8rem}}@media(max-width:460px){.year-grid,.game-grid{grid-template-columns:1fr}.brand p{display:none}.card{min-height:125px}}
</style></head><body><div class="app"><header><div class="brand"><h1>🌙 Jawi Kids Adventure</h1><p>100 perkataan Jawi • Tahun 1 hingga Tahun 3</p></div><div class="stats"><span class="chip">⭐ <span id="score">0</span></span><span class="chip">❤️ <span id="lives">3</span></span><span class="chip">⏱️ <span id="time">90</span>s</span><span class="chip">🏆 <span id="high">0</span></span></div></header>
<section id="years" class="view active"><h2>Pilih Tahun</h2><div class="year-grid"><button class="year" data-year="1"><span class="icon">🌱</span><strong>Tahun 1</strong><small>Huruf dan perkataan asas</small></button><button class="year" data-year="2"><span class="icon">🌿</span><strong>Tahun 2</strong><small>Perkataan dan ejaan mudah</small></button><button class="year" data-year="3"><span class="icon">🌳</span><strong>Tahun 3</strong><small>Perkataan lebih panjang</small></button></div></section>
<section id="menu" class="view"><div class="top"><button id="changeYear" class="back">← Tukar Tahun</button><h2 id="yearTitle"></h2><span></span></div><div class="game-grid"><button class="card" data-game="letter"><span class="icon">🔤</span><strong>Kenal Huruf</strong><small>Padankan Jawi dan Rumi</small></button><button class="card" data-game="sound"><span class="icon">👂</span><strong>Cari Huruf</strong><small>Pilih huruf yang betul</small></button><button class="card" data-game="picture"><span class="icon">🖼️</span><strong>Jawi Bergambar</strong><small>Padankan gambar dan perkataan</small></button><button class="card" data-game="rumi"><span class="icon">📖</span><strong>Jawi ke Rumi</strong><small>Baca perkataan Jawi</small></button><button class="card" data-game="complete"><span class="icon">✍️</span><strong>Lengkapkan Ejaan</strong><small>Cari huruf yang hilang</small></button><button class="card" data-game="arrange"><span class="icon">🧩</span><strong>Susun Huruf</strong><small>Susun huruf menjadi perkataan</small></button><button class="card" data-game="boss"><span class="icon">👑</span><strong>Boss Challenge</strong><small>Campuran semua aktiviti</small></button></div></section>
<section id="play" class="view"><div class="top"><button id="back" class="back">← Menu</button><h2 id="title"></h2><span class="chip">Soalan <span id="round">1</span>/10</span></div><div class="timer"><div id="fill" class="fill"></div></div><div id="arena" class="arena"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div></section>
<section id="result" class="view"><div id="medal" class="medal">🏅</div><h2 id="resultTitle">Tahniah!</h2><p id="resultText"></p><button id="again" class="primary">Main Lagi</button><button id="home" class="primary">Pilih Game</button></section></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),views=[...document.querySelectorAll('.view')],arena=$('#arena'),answers=$('#answers'),feedback=$('#feedback');const letters=[['ا','A / Alif'],['ب','B / Ba'],['ت','T / Ta'],['ج','J / Jim'],['د','D / Dal'],['ر','R / Ra'],['س','S / Sin'],['م','M / Mim'],['ن','N / Nun'],['و','W / Wau'],['ي','Y / Ya'],['ک','K / Kaf'],['ل','L / Lam'],['ݢ','G / Ga'],['ڤ','P / Pa'],['چ','C / Ca'],['ڠ','NG / Nga'],['ڽ','NY / Nya'],['ه','H / Ha'],['ف','F / Fa']];const banks={1:[['baju','باجو','👕'],['buku','بوکو','📕'],['bola','بولا','⚽'],['susu','سوسو','🥛'],['nasi','ناسي','🍚'],['roti','روتي','🍞'],['dadu','دادو','🎲'],['roda','رودا','🛞'],['tali','تالي','🪢'],['lagu','لاݢو','🎵'],['mata','مات','👁️'],['gigi','ݢيݢي','🦷'],['kaki','کاکي','🦶'],['jari','جاري','☝️'],['ayam','ايم','🐔'],['ikan','ايکن','🐟'],['kuda','کودا','🐴'],['sapi','ساڤي','🐄'],['meja','ميجا','🪑'],['guru','ݢورو','🧑‍🏫'],['ibu','ايبو','👩'],['bapa','باڤ','👨'],['adik','اديق','🧒'],['api','اڤي','🔥'],['ubi','اوبي','🍠'],['jam','جم','⏰'],['topi','توڤي','🧢'],['kuih','کوءيه','🧁'],['bunga','بوڠا','🌸'],['bulan','بولن','🌙']],2:[['sekolah','سکوله','🏫'],['pensel','ڤينسيل','✏️'],['kerusi','کروسي','🪑'],['pemadam','ڤمادم','🧽'],['beg','بيݢ','🎒'],['kelas','کلس','🏫'],['kertas','کرتس','📄'],['rumah','رومه','🏠'],['bilik','بيليق','🚪'],['dapur','داڤور','🍳'],['sudu','سودو','🥄'],['cawan','چاون','🥤'],['pinggan','ڤيڠݢن','🍽️'],['epal','ايڤل','🍎'],['oren','اورين','🍊'],['pisang','ڤيسڠ','🍌'],['hijau','هيجاو','🟢'],['merah','ميره','🔴'],['biru','بيرو','🔵'],['kuning','کونيڠ','🟡'],['papan','ڤاڤن','🪵'],['pintu','ڤينتو','🚪'],['tingkap','تيڠکڤ','🪟'],['lampu','لمڤو','💡'],['kipas','کيڤس','🌀'],['kasut','کاسوت','👟'],['stoking','ستوکيڠ','🧦'],['seluar','سلوار','👖'],['kemeja','کميجا','👔'],['mangga','مڠݢا','🥭'],['durian','دورين','🌰'],['anggur','اڠݢور','🍇'],['hitam','هيتم','⚫'],['putih','ڤوتيه','⚪'],['coklat','چوکلت','🟤']],3:[['perpustakaan','ڤرڤوستاکاءن','📚'],['komputer','کومڤوتر','💻'],['telefon','تيليفون','📱'],['keluarga','کلوارݢ','👨‍👩‍👧'],['sarapan','ساراڤن','🥣'],['makanan','ماکنن','🍱'],['minuman','مينومن','🥤'],['kenderaan','کندراءن','🚗'],['basikal','باسيکل','🚲'],['kapal','کاڤل','🚢'],['lapangan','لاڤڠن','🏞️'],['permainan','ڤرماينن','🎮'],['kesihatan','کصيحتن','🩺'],['kebersihan','کبرسيهن','🧼'],['tumbuhan','تومبوهن','🌱'],['haiwan','حيوان','🐾'],['kejiranan','کجيرنن','🏘️'],['masyarakat','مشارکت','👥'],['keselamatan','کسلامتن','🦺'],['pelajaran','ڤلاجرن','📝'],['hospital','هوسڤيتل','🏥'],['pejabat','ڤجابت','🏢'],['lapangan terbang','لاڤڠن تربڠ','✈️'],['pasar raya','ڤاسر راي','🛒'],['balai polis','بالاي ڤوليس','🚓'],['bomba','بومبا','🚒'],['jururawat','جوروراوت','🧑‍⚕️'],['doktor','دوکتور','🩺'],['petani','ڤتاني','🧑‍🌾'],['nelayan','نلاين','🎣'],['juruterbang','جوروتربڠ','🧑‍✈️'],['kebudayaan','کبوداياءن','🎭'],['perayaan','ڤراياءن','🎉'],['persahabatan','ڤرسهابتن','🤝'],['tanggungjawab','تڠݢوڠجواب','✅']]};const titles={letter:'🔤 Kenal Huruf',sound:'👂 Cari Huruf',picture:'🖼️ Jawi Bergambar',rumi:'📖 Jawi ke Rumi',complete:'✍️ Lengkapkan Ejaan',arrange:'🧩 Susun Huruf',boss:'👑 Boss Challenge'};let year=1,game='',score=0,lives=3,time=90,round=1,correct=0,locked=false,tick,pool=[],current,selected=[];let high=0;try{high=+(window.localStorage.getItem('jawiKidsHighV2')||0)}catch(e){}$('#high').textContent=high;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>[...a].sort(()=>Math.random()-.5);function show(id){views.forEach(v=>v.classList.remove('active'));$(id).classList.add('active')}function update(){$('#score').textContent=score;$('#lives').textContent=lives;$('#time').textContent=time;$('#round').textContent=Math.min(round,10);$('#fill').style.width=(time/90*100)+'%';if(score>high){high=score;try{window.localStorage.setItem('jawiKidsHighV2',high)}catch(e){}$('#high').textContent=high}}function tone(f,d=.14,delay=0){try{let A=window.AudioContext||window.webkitAudioContext,c=new A,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}catch(e){}}function burst(){for(let i=0;i<12;i++){let s=document.createElement('span');s.className='burst';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='55%';let a=Math.PI*2*i/12,d=rand(70,170);s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}function opts(list,good,n=4){let o=[good];while(o.length<n){let x=list[rand(0,list.length-1)];if(!o.includes(x))o.push(x)}return shuffle(o)}function buttons(list,ans,jawi=false){answers.innerHTML='';list.forEach(x=>{let b=document.createElement('button');b.className='answer'+(jawi?' jawi-option':'');b.textContent=x;b.onclick=()=>pick(x,ans,b);answers.appendChild(b)})}function pick(x,ans,b){if(locked)return;if(x===ans){locked=true;score+=10;correct++;feedback.textContent='Betul! Pandai membaca Jawi! 🌟';feedback.className='feedback good';b.style.background='#72dfa9';tone(530);tone(710,.18,.14);burst();update();setTimeout(next,850)}else{lives--;feedback.textContent='Cuba lagi. Lihat dengan teliti.';feedback.className='feedback bad';tone(230,.2);update();if(lives<=0)setTimeout(end,400)}}function start(g){game=g;score=0;lives=3;time=90;round=1;correct=0;locked=false;pool=shuffle(banks[year]);$('#title').textContent=titles[g];feedback.textContent='';show('#play');clearInterval(tick);tick=setInterval(()=>{time--;update();if(time<=0)end()},1000);update();question()}function next(){if(lives<=0||time<=0)return end();if(++round>10)return end();locked=false;feedback.textContent='';question()}function question(){current=pool.shift();let type=game==='boss'?shuffle(['picture','rumi','complete','arrange'])[0]:game;answers.innerHTML='';if(type==='letter'){let q=letters[rand(0,letters.length-1)];arena.innerHTML=`<div><p class="prompt">Apakah padanan huruf ini?</p><div class="jawi">${q[0]}</div></div>`;buttons(opts(letters.map(x=>x[1]),q[1]),q[1])}else if(type==='sound'){let q=letters[rand(0,letters.length-1)];arena.innerHTML=`<div><p class="prompt">Pilih huruf bagi bunyi ${q[1]}</p></div>`;buttons(opts(letters.map(x=>x[0]),q[0]),q[0],true)}else if(type==='picture'){arena.innerHTML=`<div><p class="prompt">Pilih perkataan Jawi yang betul</p><div class="picture">${current[2]}</div><strong>${current[0].toUpperCase()}</strong></div>`;buttons(opts(banks[year].map(x=>x[1]),current[1]),current[1],true)}else if(type==='rumi'){arena.innerHTML=`<div><p class="prompt">Apakah bacaan Rumi?</p><div class="jawi word">${current[1]}</div></div>`;buttons(opts(banks[year].map(x=>x[0]),current[0]),current[0])}else if(type==='complete'){let chars=[...current[1]],pos=rand(0,chars.length-1),ans=chars[pos];chars[pos]='ـ';arena.innerHTML=`<div><p class="prompt">Pilih huruf yang hilang</p><div class="jawi word">${chars.join('')}</div><strong>${current[0].toUpperCase()}</strong></div>`;buttons(opts(letters.map(x=>x[0]),ans),ans,true)}else arrange()}function arrange(){selected=[];let chars=shuffle([...current[1]]);arena.innerHTML=`<div style="width:100%"><p class="prompt">Susun huruf untuk membentuk: <strong>${current[0].toUpperCase()}</strong></p><div id="built" class="built"></div><div id="bank" class="word-bank"></div><button id="check" class="primary">Semak</button></div>`;chars.forEach((ch,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=ch;b.dataset.id=i;b.onclick=()=>{if(b.hidden)return;b.hidden=true;selected.push({ch,id:i});draw()};$('#bank').appendChild(b)});$('#check').onclick=()=>{if(selected.map(x=>x.ch).join('')===current[1])pick(current[1],current[1],$('#check'));else{lives--;feedback.textContent='Susunan belum betul. Cuba semula!';feedback.className='feedback bad';selected=[];[...$('#bank').children].forEach(x=>x.hidden=false);draw();update();if(lives<=0)setTimeout(end,400)}}}function draw(){let box=$('#built');box.innerHTML='';selected.forEach((o,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=o.ch;b.onclick=()=>{selected.splice(i,1);let src=[...$('#bank').children].find(x=>+x.dataset.id===o.id);if(src)src.hidden=false;draw()};box.appendChild(b)})}function end(){clearInterval(tick);locked=true;$('#medal').textContent=score>=80?'🥇':score>=50?'🥈':'🥉';$('#resultTitle').textContent=lives<=0?'Jangan putus asa!':'Tahniah!';$('#resultText').innerHTML=`Tahun ${year}<br>Skor: <b>${score}</b><br>Betul: <b>${correct}</b>/10<br>High score: <b>${high}</b>`;show('#result');update()}document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=+b.dataset.year;$('#yearTitle').textContent='Tahun '+year;show('#menu')});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#changeYear').onclick=()=>show('#years');$('#back').onclick=()=>{clearInterval(tick);show('#menu')};$('#home').onclick=()=>show('#menu');$('#again').onclick=()=>start(game);update()})();
</script></body></html>
