<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#62c9ba"><title>Jawi Kids Adventure - Tahap 1</title><style>
:root{--teal:#62c9ba;--sky:#83d4ff;--yellow:#ffe37b;--pink:#ffb6c8;--ink:#27485a;--green:#49aa7e;--red:#ef7070}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#c9f0ff,#ddf7df 60%,#fff2a9)}button{font:inherit}.app{width:min(980px,100%);min-height:calc(100vh - 32px);margin:auto;background:#fffdf6;border:5px solid white;border-radius:30px;overflow:hidden;box-shadow:0 16px 35px #3a789033}header{padding:16px 20px;background:linear-gradient(110deg,var(--teal),var(--sky));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;color:white;font-size:clamp(1.4rem,4vw,2.35rem);text-shadow:0 3px #32958a}.brand p{margin:4px 0 0;font-weight:900}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.chip{background:white;border:3px solid var(--yellow);border-radius:17px;padding:7px 11px;font-weight:1000;white-space:nowrap}.view{display:none;padding:clamp(18px,4vw,34px);text-align:center}.view.active{display:block}.intro{font-size:1.25rem;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:0;border-radius:24px;padding:20px 12px;min-height:160px;cursor:pointer;color:var(--ink);box-shadow:0 8px 0 #35778a22;transition:.15s}.card:hover{transform:translateY(-4px)}.card:nth-child(1),.card:nth-child(5){background:#c9f0ff}.card:nth-child(2){background:#c9f1d8}.card:nth-child(3){background:#fff0a5}.card:nth-child(4){background:#ffd0db}.card:nth-child(5){grid-column:span 2}.icon{display:block;font-size:3rem}.card strong{display:block;font-size:1.2rem;margin:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.back,.primary{border:0;border-radius:17px;padding:11px 17px;font-weight:1000;cursor:pointer;box-shadow:0 6px 0 #2e8f85}.back{background:#dff3ff;color:#28647c;box-shadow:0 5px 0 #add7e9}.primary{background:var(--teal);color:#164f4a;margin:6px}.arena{min-height:300px;display:grid;place-items:center;background:white;border:4px solid #daf0f6;border-radius:28px;padding:24px;box-shadow:0 9px 0 #cbe5ec}.prompt{font-size:clamp(1.2rem,4vw,1.7rem);font-weight:1000;margin:0 0 18px}.jawi{font-family:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;direction:rtl;font-size:clamp(4rem,14vw,8rem);line-height:1.2;color:#267e76}.word{font-size:clamp(2.8rem,10vw,5.5rem)}.picture{font-size:4.5rem}.answers{max-width:740px;margin:20px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.answer{border:0;border-radius:20px;min-height:72px;padding:10px;background:var(--yellow);box-shadow:0 7px 0 #dfb943;font-size:clamp(1.3rem,4vw,2rem);font-weight:1000;color:#5b4810;cursor:pointer}.answer:nth-child(even){background:#b8ead0;box-shadow:0 7px 0 #67b891;color:#205b43}.answer.jawi-option{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;font-size:2.4rem}.feedback{min-height:42px;margin-top:14px;font-size:1.45rem;font-weight:1000}.good{color:var(--green)}.bad{color:var(--red)}.match-row{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}.match-box{min-width:130px;padding:15px;border-radius:20px;background:#edfbff;font-size:2rem;font-weight:900}.letter-board{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:650px}.letter-btn{width:80px;height:80px;border:0;border-radius:19px;background:#d8f3e5;box-shadow:0 6px 0 #85c9a7;font-family:"Traditional Arabic",serif;font-size:2.8rem;cursor:pointer}.result .medal{font-size:5rem}.result h2{font-size:2rem}.burst{position:fixed;z-index:9;pointer-events:none;font-size:2rem;animation:burst .9s forwards}.shake{animation:shake .35s}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(220deg) scale(1.4);opacity:0}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@media(max-width:700px){body{padding:0}.app{min-height:100vh;border:0;border-radius:0}.grid{grid-template-columns:repeat(2,1fr)}.card:nth-child(5){grid-column:span 2}.answers{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.stats{max-width:145px}.chip{font-size:.8rem;padding:6px 8px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.card:nth-child(5){grid-column:span 1}.brand p{display:none}.card{min-height:130px}}
</style></head><body><div class="app"><header><div class="brand"><h1>🌙 Jawi Kids Adventure</h1><p>Belajar Jawi Tahap 1 sambil bermain</p></div><div class="stats"><span class="chip">⭐ <span id="score">0</span></span><span class="chip">❤️ <span id="lives">3</span></span><span class="chip">🏆 <span id="high">0</span></span></div></header>
<section id="menu" class="view active"><p class="intro">Pilih permainan Jawi kamu!</p><div class="grid"><button class="card" data-game="letter"><span class="icon">🔤</span><strong>Kenal Huruf</strong><small>Padankan huruf Jawi dan Rumi</small></button><button class="card" data-game="sound"><span class="icon">👂</span><strong>Cari Huruf</strong><small>Pilih huruf berdasarkan bunyi</small></button><button class="card" data-game="picture"><span class="icon">🖼️</span><strong>Jawi Bergambar</strong><small>Padankan gambar dengan perkataan</small></button><button class="card" data-game="rumi"><span class="icon">📖</span><strong>Jawi ke Rumi</strong><small>Baca perkataan mudah</small></button><button class="card" data-game="hunt"><span class="icon">🔎</span><strong>Buruan Huruf</strong><small>Cari huruf yang diminta</small></button></div></section>
<section id="play" class="view"><div class="top"><button id="back" class="back">← Menu</button><h2 id="title"></h2><span class="chip">Soalan <span id="round">1</span>/10</span></div><div id="arena" class="arena"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div></section>
<section id="result" class="view result"><div id="medal" class="medal">🏅</div><h2 id="resultTitle">Tahniah!</h2><p id="resultText"></p><button id="again" class="primary">Main Lagi</button><button id="home" class="primary">Pilih Game</button></section></div>
<script>(()=>{'use strict';const $=s=>document.querySelector(s),menu=$('#menu'),play=$('#play'),result=$('#result'),arena=$('#arena'),answers=$('#answers'),feedback=$('#feedback');const letters=[['ا','A / Alif'],['ب','B / Ba'],['ت','T / Ta'],['ج','J / Jim'],['د','D / Dal'],['ر','R / Ra'],['س','S / Sin'],['م','M / Mim'],['ن','N / Nun'],['و','W / Wau'],['ي','Y / Ya'],['ک','K / Kaf'],['ل','L / Lam'],['ݢ','G / Ga'],['ڤ','P / Pa'],['چ','C / Ca'],['ڠ','NG / Nga'],['ڽ','NY / Nya']];const words=[{r:'baju',j:'باجو',e:'👕'},{r:'buku',j:'بوکو',e:'📕'},{r:'bola',j:'بولا',e:'⚽'},{r:'susu',j:'سوسو',e:'🥛'},{r:'nasi',j:'ناسي',e:'🍚'},{r:'roti',j:'روتي',e:'🍞'},{r:'dadu',j:'دادو',e:'🎲'},{r:'roda',j:'رودا',e:'🛞'},{r:'tali',j:'تالي',e:'🪢'},{r:'lagu',j:'لاݢو',e:'🎵'}];const titles={letter:'🔤 Kenal Huruf',sound:'👂 Cari Huruf',picture:'🖼️ Jawi Bergambar',rumi:'📖 Jawi ke Rumi',hunt:'🔎 Buruan Huruf'};let game='',score=0,lives=3,round=1,correct=0,locked=false,high=Number(localStorage.getItem('jawiKidsHigh')||0);$('#high').textContent=high;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function show(v){[menu,play,result].forEach(x=>x.classList.remove('active'));v.classList.add('active')}function update(){$('#score').textContent=score;$('#lives').textContent=lives;$('#round').textContent=Math.min(round,10);if(score>high){high=score;localStorage.setItem('jawiKidsHigh',high);$('#high').textContent=high}}function tone(f,d=.15,delay=0){try{let A=window.AudioContext||window.webkitAudioContext,c=new A,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}catch(e){}}function happy(){tone(520,.14);tone(660,.14,.13);tone(790,.2,.26)}function sad(){tone(250,.2)}function burst(){for(let i=0;i<12;i++){let s=document.createElement('span');s.className='burst';s.textContent=i%2?'⭐':'✨';s.style.left='50%';s.style.top='55%';let a=Math.PI*2*i/12,d=rand(70,170);s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}function uniqueChoices(list,good,n=4){let out=[good];while(out.length<n){let x=list[rand(0,list.length-1)];if(!out.includes(x))out.push(x)}return out.sort(()=>Math.random()-.5)}function render(opts,answer,jawi=false){answers.innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.className='answer'+(jawi?' jawi-option':'');b.textContent=x;b.onclick=()=>pick(x,answer,b);answers.appendChild(b)})}function pick(x,answer,b){if(locked)return;if(x===answer){locked=true;score+=10;correct++;feedback.textContent='Betul! Pandai membaca Jawi! 🌟';feedback.className='feedback good';b.style.background='#74dfa9';happy();burst();update();setTimeout(next,850)}else{lives--;feedback.textContent='Cuba lagi! Lihat huruf dengan teliti.';feedback.className='feedback bad shake';b.classList.add('shake');sad();update();setTimeout(()=>b.classList.remove('shake'),400);if(lives<=0)setTimeout(end,450)}}function start(g){game=g;score=0;lives=3;round=1;correct=0;locked=false;$('#title').textContent=titles[g];feedback.textContent='';show(play);update();question()}function next(){if(lives<=0)return end();round++;if(round>10)return end();locked=false;feedback.textContent='';feedback.className='feedback';question()}function question(){answers.innerHTML='';let item,opts;if(game==='letter'){item=letters[rand(0,letters.length-1)];arena.innerHTML=`<div><p class="prompt">Apakah padanan huruf ini?</p><div class="jawi">${item[0]}</div></div>`;opts=uniqueChoices(letters.map(x=>x[1]),item[1]);render(opts,item[1])}if(game==='sound'){item=letters[rand(0,letters.length-1)];arena.innerHTML=`<div><p class="prompt">Pilih huruf bagi bunyi:</p><div class="match-box">${item[1]}</div></div>`;opts=uniqueChoices(letters.map(x=>x[0]),item[0]);render(opts,item[0],true)}if(game==='picture'){item=words[rand(0,words.length-1)];arena.innerHTML=`<div><p class="prompt">Pilih perkataan Jawi untuk gambar ini</p><div class="picture">${item.e}</div><strong>${item.r.toUpperCase()}</strong></div>`;opts=uniqueChoices(words.map(x=>x.j),item.j);render(opts,item.j,true)}if(game==='rumi'){item=words[rand(0,words.length-1)];arena.innerHTML=`<div><p class="prompt">Apakah bacaan Rumi?</p><div class="jawi word">${item.j}</div></div>`;opts=uniqueChoices(words.map(x=>x.r),item.r);render(opts,item.r)}if(game==='hunt'){item=letters[rand(0,letters.length-1)];let board=uniqueChoices(letters.map(x=>x[0]),item[0],8);arena.innerHTML=`<div><p class="prompt">Cari huruf <strong>${item[1]}</strong></p><div class="letter-board" id="board"></div></div>`;answers.innerHTML='';board.forEach(x=>{let b=document.createElement('button');b.className='letter-btn';b.textContent=x;b.onclick=()=>pick(x,item[0],b);$('#board').appendChild(b)})}}function end(){locked=true;let medal=score>=80?'🥇':score>=50?'🥈':'🥉';$('#medal').textContent=medal;$('#resultTitle').textContent=lives<=0?'Jangan putus asa!':'Tahniah!';$('#resultText').innerHTML=`Skor: <strong>${score}</strong><br>Jawapan betul: <strong>${correct}</strong>/10<br>High score: <strong>${high}</strong>`;show(result)}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#back').onclick=()=>show(menu);$('#home').onclick=()=>show(menu);$('#again').onclick=()=>start(game);update()})();</script></body></html>
